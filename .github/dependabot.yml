version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10

    # Group packages into shared PR
    groups:
      dev:
        applies-to: 'version-updates'
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

      prod:
        applies-to: 'version-updates'
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

      security:
        applies-to: 'security-updates'
        patterns:
          - '*'

      other:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

    schedule:
      interval: 'weekly'

    cooldown:
      default-days: 7

    versioning-strategy: increase

    ignore:
      # global-agent pinned to 3.x — v4 reworks the proxy API and breaks CDP forward-proxy setup
      - dependency-name: global-agent
        update-types:
          - version-update:semver-major

      # mongodb 7.6.0 sends malformed client metadata under babel-jest (missing 'driver'
      # sub-document), so mongod rejects the handshake and every integration test times out.
      # Pinned to 7.5.0; re-evaluate when the driver regression is fixed upstream.
      - dependency-name: mongodb
        versions:
          - '7.6.0'

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    schedule:
      interval: 'weekly'

    cooldown:
      default-days: 7
